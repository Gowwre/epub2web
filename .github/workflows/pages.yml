name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "epub2web/**"
      - "pyproject.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Resolve the latest release downloads
        working-directory: site
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/fetch-release.mjs

      - name: Build the landing site
        working-directory: site
        env:
          BASE_PATH: /epub2web
          SITE_URL: https://gowwre.github.io
        run: |
          npm ci
          npm run build

      - name: Stage the landing site
        run: |
          mkdir -p _site
          cp -R site/dist/. _site/

      - name: Install epub2web
        run: pip install .

      - name: Fetch a public-domain demo book
        run: >
          curl -fsSL -o "$RUNNER_TEMP/alice.epub"
          https://www.gutenberg.org/cache/epub/11/pg11-images.epub

      - name: Build the demo site
        run: >
          epub2web "$RUNNER_TEMP/alice.epub"
          -o _site/demo
          --base-path /epub2web/demo
          --site-url https://gowwre.github.io
          --force

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
