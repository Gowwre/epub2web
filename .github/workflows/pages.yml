name: Demo site

on:
  push:
    branches: [main]
    paths:
      - "epub2web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Install epub2web
        run: pip install .
      - name: Fetch a public-domain demo book
        run: >
          curl -fsSL -o "$RUNNER_TEMP/alice.epub"
          https://www.gutenberg.org/cache/epub/11/pg11-images.epub
      - name: Build the demo site
        run: >
          epub2web "$RUNNER_TEMP/alice.epub"
          -o _site
          --base-path /epub2web
          --site-url https://gowwre.github.io
          --force
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
