{% macro icon(name, size=20) -%}
<svg class="icon icon-{{ name }}" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  {%- if name == "menu" -%}
  <path d="M4 7h16M4 12h16M4 17h16"/>
  {%- elif name == "close" -%}
  <path d="M6 6l12 12M18 6L6 18"/>
  {%- elif name == "search" -%}
  <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/>
  {%- elif name == "sun" -%}
  <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
  {%- elif name == "moon" -%}
  <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/>
  {%- elif name == "arrow-left" -%}
  <path d="M19 12H5M11 18l-6-6 6-6"/>
  {%- elif name == "arrow-right" -%}
  <path d="M5 12h14M13 6l6 6-6 6"/>
  {%- elif name == "chevron-down" -%}
  <path d="M6 9l6 6 6-6"/>
  {%- elif name == "book" -%}
  <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5V5.5Z"/><path d="M4 18.5A2.5 2.5 0 0 1 6.5 16H20"/>
  {%- elif name == "highlighter" -%}
  <path d="M15 4l5 5-9.5 9.5H5.5V13L15 4Z"/><path d="M12 7l5 5"/><path d="M4 20h16"/>
  {%- elif name == "globe" -%}
  <circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.5 2.7 4 5.7 4 9s-1.5 6.3-4 9c-2.5-2.7-4-5.7-4-9s1.5-6.3 4-9Z"/>
  {%- elif name == "note" -%}
  <path d="M4 4h16v12l-4 4H4V4Z"/><path d="M16 20v-4h4"/><path d="M8 8h8M8 12h5"/>
  {%- endif -%}
</svg>
{%- endmacro %}
