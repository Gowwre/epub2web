[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "epub2web"
dynamic = ["version"]
description = "Turn an EPUB into a beautiful, browser-optimized static website. Deterministic, no LLM, with a text-fidelity gate."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "epub2web contributors" }]
keywords = ["epub", "ebook", "html", "static-site", "publishing", "accessibility"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: Markup :: HTML",
]
dependencies = [
  "beautifulsoup4>=4.12",
  "Jinja2>=3.1",
  "lxml>=5.0",
  "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.9",
  "build>=1.2",
  "twine>=5",
]
gui-build = [
  "pyinstaller>=6",
]

[project.scripts]
epub2web = "epub2web.cli:main"

[project.gui-scripts]
epub2web-gui = "epub2web.gui:main"

[project.urls]
Homepage = "https://github.com/Gowwre/epub2web"
Source = "https://github.com/Gowwre/epub2web"
Issues = "https://github.com/Gowwre/epub2web/issues"

[tool.setuptools.dynamic]
version = { attr = "epub2web.__version__" }

[tool.setuptools.packages.find]
include = ["epub2web*"]

[tool.setuptools.package-data]
epub2web = [
  "templates/*.html",
  "theme/assets/*",
  "theme/assets/fonts/*",
  "theme/favicon.svg",
  "py.typed",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::bs4.XMLParsedAsHTMLWarning"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["epub2web", "tests", "scripts"]
extend-exclude = ["build", "dist", "*.egg-info"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
